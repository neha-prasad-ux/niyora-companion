name: NiyoraCompanion
options:
  bundleIdPrefix: com.niyora
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: "YES"
    # Shown in the HealthKit permission sheet. The shipping HRV path is
    # PPG (no HealthKit); HealthKit is read only by the DEBUG spike
    # screen, which we still ship the entitlement for so a developer
    # build can sanity-check Watch HRV in isolation.
    INFOPLIST_KEY_NSHealthShareUsageDescription: "Used by the debug HRV screen to compare your Apple Watch's HRV against the camera-based stress estimate. Stays on your devices."
    # Camera is used for two things, both explicitly initiated: scanning
    # the pairing QR (once, at setup) and taking a 30 second stress
    # estimate from your fingertip on the lens (only after you tap
    # Measure stress on the Mac). No photos are taken; no video is
    # recorded or sent anywhere.
    INFOPLIST_KEY_NSCameraUsageDescription: "Niyora Companion uses the camera to scan the pairing QR on your Mac, and to take a 30 second stress estimate from your fingertip when you tap Measure stress. Nothing leaves your devices."
    # Shown when the app first opens a TCP connection to your Mac. iOS
    # requires this for any peer connection on the LAN.
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Niyora Companion connects to Niyora on your Mac over your local wifi. No data is uploaded; the connection stays on your home network."
targets:
  NiyoraCompanion:
    type: application
    platform: iOS
    sources:
      - path: NiyoraCompanion
      - path: NiyoraCompanion/Resources
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niyora.companion
        CODE_SIGN_ENTITLEMENTS: NiyoraCompanion/NiyoraCompanion.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        # Fill this in with your Apple Developer team ID (Xcode > Settings >
        # Accounts, or the membership page). Without it, signing fails.
        # DEVELOPMENT_TEAM: XXXXXXXXXX
